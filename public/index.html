<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GPS Attendance</title>
<link rel="stylesheet" href="style.css" />
<script>
  (function() {
    var saved = localStorage.getItem('theme');
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
</head>
<body>
<div class="center-screen">
  <div class="card wrap narrow" style="width:100%;text-align:center;">
    <h2>GPS Attendance System</h2>
    <p class="muted">Choose a panel to continue.</p>
    <div class="grid" style="gap:10px;margin-top:14px;">
      <a class="btn" href="employee.html" style="text-decoration:none;display:block;">Employee Punch In/Out</a>
      <a class="btn secondary" href="admin.html" style="text-decoration:none;display:block;">Admin Panel</a>
    </div>
  </div>
</div>
</body>
</html>
